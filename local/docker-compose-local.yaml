services:
  # Postgres local instance
  postgres:
    image: postgres:15
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - /tmp/postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  # Config
  config:
    build: ../config
#    image: ghcr.io/filberol/highload_systems/config:latest
    container_name: config
    ports:
      - "8888:8888"
    depends_on:
      - postgres
    networks:
      - app-network

  # Department
  department:
    build: ../department
#    image: ghcr.io/filberol/highload_systems/department:latest
    container_name: department
    ports:
      - "8086:8086"
    depends_on:
      - postgres
      - config
      - eureka
    networks:
      - app-network
  # Auth
  auth:
#    image: ghcr.io/filberol/highload_systems/auth:latest
    build: ../auth
    container_name: auth
    ports:
      - "8085:8085"
    depends_on:
      #      - config
      - postgres
    #      - eureka
    networks:
      - app-network
  notification:
    build: ../notification
    container_name: notification
    ports:
      - "8091:8091"
    #    depends_on:
    #      - config
    #      - postgres
    #      - eureka
    networks:
      - app-network
  # Eureka
  eureka:
    image: ghcr.io/filberol/highload_systems/eureka:latest
    container_name: eureka
    ports:
      - "8761:8761"
    networks:
      - app-network
  # Gateway
  gateway:
    build: ../gateway
#    image: ghcr.io/filberol/highload_systems/gateway:latest
    container_name: gateway
    ports:
      - "8080:8080"
    depends_on:
      - config
    networks:
      - app-network
  file:
    build: ../files
#    image: ghcr.io/filberol/highload_systems/files:latest
    container_name: file
    ports:
      - "8090:8090"
    depends_on:
      - config
    networks:
      - app-network
  # Eureka
  order:
    build: ../order
#    image: ghcr.io/filberol/highload_systems/order:latest
    container_name: order
    ports:
      - "8087:8087"
    depends_on:
      - config
      - postgres
      - eureka
    networks:
      - app-network
  # Oxygen
  oxygen:
    image: ghcr.io/filberol/highload_systems/oxygen:latest
    container_name: oxygen
    ports:
      - "8096:8096"
    depends_on:
      - config
      - postgres
      - eureka
    networks:
      - app-network
  minio:
    image: quay.io/minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server --console-address ":9001" /data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
      MINIO_SERVICE_PUBLIC_ENDPOINT: http://localhost:9000
    networks:
      - app-network
    volumes:
      - minio-data:/data
  controller-1:
    networks:
      - app-network
    image: apache/kafka:latest
    container_name: controller-1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  controller-2:
    networks:
      - app-network
    image: apache/kafka:latest
    container_name: controller-2
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  controller-3:
    networks:
      - app-network
    image: apache/kafka:latest
    container_name: controller-3
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: controller
      KAFKA_LISTENERS: CONTROLLER://:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

  broker-1:
    networks:
      - app-network
    image: apache/kafka:latest
    container_name: broker-1
    ports:
      - 29092:9092
    environment:
      KAFKA_NODE_ID: 4
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-1:19092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - controller-1
      - controller-2
      - controller-3

  broker-2:
    networks:
      - app-network
    image: apache/kafka:latest
    container_name: broker-2
    ports:
      - 39092:9092
    environment:
      KAFKA_NODE_ID: 5
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-2:19092,PLAINTEXT_HOST://localhost:39092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - controller-1
      - controller-2
      - controller-3

  broker-3:
    networks:
      - app-network
    image: apache/kafka:latest
    container_name: broker-3
    ports:
      - 49092:9092
    environment:
      KAFKA_NODE_ID: 6
      KAFKA_PROCESS_ROLES: broker
      KAFKA_LISTENERS: 'PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://:9092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://broker-3:19092,PLAINTEXT_HOST://localhost:49092'
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@controller-1:9093,2@controller-2:9093,3@controller-3:9093
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    depends_on:
      - controller-1
      - controller-2
      - controller-3

  ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports:
      - "8585:8080"
    environment:
      KAFKA_CLUSTERS_0_BOOTSTRAP_SERVERS: "broker-1:19092"
      KAFKA_CLUSTERS_0_NAME: broker-1
      DYNAMIC_CONFIG_ENABLED: 'true'
    networks:
      - app-network

volumes:
  minio-data:

networks:
  app-network:
    driver: bridge
