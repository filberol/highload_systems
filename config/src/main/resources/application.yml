server:
  port: 8888

spring:
  application:
    name: config
  cloud:
    config:
      server:
        git:
          uri: https://github.com/anekoss/configs.git
          default-label: main
          search-paths: {application}

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka/